# Configuración de Streamlit para Proteo.
#
# Tema "caja beige", variante B: tokens en app/theme.py y referencia
# visual en docs/style_tile.html. Lo que el tema nativo no cubre lo
# cubre theme.inject_css().

[server]
port = 8765
headless = true

[browser]
gatherUsageStats = false

[theme]
base = "light"
primaryColor = "#E8792B"                 # nino
backgroundColor = "#EFE7D5"              # papel
secondaryBackgroundColor = "#E1D8C3"     # panel
textColor = "#2B2925"                    # linea
borderColor = "#2B2925"                  # linea
dataframeBorderColor = "#2B2925"
dataframeHeaderBackgroundColor = "#E1D8C3"
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "4px"                       # variante B (A usaría 6px)
buttonRadius = "4px"
linkColor = "#22706D"                    # nina
codeTextColor = "#2B2925"
codeBackgroundColor = "#E1D8C3"
font = "IBM Plex Sans, system-ui, sans-serif"
headingFont = "IBM Plex Sans, system-ui, sans-serif"
codeFont = "IBM Plex Mono, ui-monospace, Consolas, monospace"
metricValueFontSize = "19px"
chartCategoricalColors = ["#2B2925", "#E8792B", "#22706D", "#625B53"]
